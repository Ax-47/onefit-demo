<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneFit</title>
<meta name="description" content="OneFit demo — สแกนอาหารด้วย AI คำนวณแคลอรี พร้อมมินิเวิร์กเอาต์ชดเชยส่วนเกิน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF4EF;
  --surface:#FFFFFF;
  --surface-2:#F4F8F4;
  --ink:#16302A;
  --ink-2:#4E6660;
  --ink-3:#8AA09A;
  --line:#DCE6DF;
  --mint:#CFEBDD;
  --lime:#C9E86A;
  --lime-ink:#243300;
  --peach:#F5C7B1;
  --coral:#E1603F;
  --coral-soft:#FBE3DA;
  --good:#2F8F5B;
  --good-soft:#DDF1E5;
  --shadow:0 1px 2px rgba(22,48,42,.06),0 8px 24px rgba(22,48,42,.08);
  --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Prompt",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1614;--surface:#16211E;--surface-2:#1C2926;--ink:#E6F0EB;--ink-2:#A9BDB6;--ink-3:#6F857E;
    --line:#26352F;--mint:#1F3A30;--lime:#C9E86A;--lime-ink:#1B2600;--peach:#5A3A2C;--coral:#F07A5A;
    --coral-soft:#3A2019;--good:#5CC48A;--good-soft:#173326;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1614;--surface:#16211E;--surface-2:#1C2926;--ink:#E6F0EB;--ink-2:#A9BDB6;--ink-3:#6F857E;
  --line:#26352F;--mint:#1F3A30;--lime:#C9E86A;--lime-ink:#1B2600;--peach:#5A3A2C;--coral:#F07A5A;
  --coral-soft:#3A2019;--good:#5CC48A;--good-soft:#173326;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground);position:relative}
@media (min-width:640px){
  body{padding-block:24px}
  .app{min-height:calc(100% - 0px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.brand span{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.pill.pro{background:var(--lime);color:var(--lime-ink);border-color:transparent}
main{flex:1;padding:4px 16px 110px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--ground);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.demo-note{font-size:12px;color:var(--ink-3);text-align:center}

/* home ring */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.stats{display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.stat b{font-weight:600}
.over-banner{background:var(--coral-soft);border:1px solid transparent;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.over-banner .kc{font-family:var(--display);font-weight:700;font-size:22px;color:var(--coral)}
.ok-banner{background:var(--good-soft);border-radius:20px;padding:14px 16px}

.meal{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.meal .name{font-weight:500}
.meal .kcal{margin-left:auto;font-weight:600;white-space:nowrap}
.meal .kcal.neg{color:var(--good)}
.x{border:0;background:none;color:var(--ink-3);padding:4px 6px;border-radius:8px}

/* scan */
.drop{border:2px dashed var(--line);border-radius:20px;padding:22px 16px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.drag{border-color:var(--good);background:var(--good-soft)}
.cam{width:64px;height:64px;border-radius:20px;background:var(--lime);display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.grid-foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.food{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.food .e{font-size:28px;line-height:1}
.food .n{font-weight:500;font-size:14px;line-height:1.35}
.food .k{font-size:12px;color:var(--ink-2)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:84px;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--lime);box-shadow:0 0 18px 4px var(--lime);animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:92%}}
.ing{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing:last-child{border-bottom:0}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center}
.macro b{display:block;font-family:var(--display);font-size:16px}
.alts{display:flex;gap:8px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--good)}
.conf{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.conf i{display:block;height:100%;background:var(--good)}

/* workout */
.focus{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.focus button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-size:13px;position:relative}
.focus button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.lock{position:absolute;top:-8px;right:-4px;font-size:9px;font-weight:700;background:var(--lime);color:var(--lime-ink);border-radius:6px;padding:1px 5px}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .idx{width:28px;height:28px;border-radius:9px;background:var(--mint);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.summary b{display:block;font-family:var(--display);font-size:20px}

.player{position:fixed;inset:0;background:var(--ink);color:var(--ground);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.player .phase{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.player .exname{font-family:var(--display);font-size:30px;font-weight:700;text-wrap:balance}
.player .timer{font-family:var(--display);font-weight:700;font-size:96px;line-height:1}
.player .bar{width:100%;max-width:400px;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.player .bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.player .ctl{display:flex;gap:10px;width:100%;max-width:400px}
.player .ctl .btn{flex:1}
.player .btn.ghost{color:var(--ground);border-color:rgba(255,255,255,.25)}
.player.rest{background:#2B4C43}
.coupon{border:2px dashed var(--lime-ink);background:var(--lime);color:var(--lime-ink);border-radius:18px;padding:16px;text-align:left;width:100%;max-width:400px}
.coupon .code{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.06em}

/* premium */
.plan{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface)}
.plan.pro{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.plan .price{font-family:var(--display);font-size:28px;font-weight:700}
.plan ul{margin:8px 0 0;padding-left:18px}
.plan li{margin:3px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tab bar */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
@media (min-width:640px){nav.tabs{bottom:24px;border-radius:0 0 28px 28px}}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink)}
nav.tabs .scanbtn{margin-top:-22px}
nav.tabs .scanbtn span.fab{width:52px;height:52px;border-radius:18px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;z-index:25;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}*{transition:none!important}}
</style>
</head>
<body>

    <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>เวิร์กเอาต์</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>โปรไฟล์</button>

</div>

  {id:'yum', n:'ต้มยำกุ้งน้ำใส', e:'🍲', c:'clean', k:160, m:[18,8,5], ing:[['กุ้ง 5 ตัว',90],['เห็ด + สมุนไพร',30],['น้ำซุป',40]]},

function buildPlan(target){
  const pool = EX.filter(e=>e.f.includes(S.focus));
  const sorted = [...pool].sort((a,b)=>b.met-a.met);
  const perRound = (WORK+REST)/60;
  let rounds = [], burn = 0, i = 0;
  while(rounds.length < 15){ // 15 × 1 min = 15 min cap
    const e = sorted[i % sorted.length]; i++;
    rounds.push(e); burn += kcalPerMin(e.met)*WORK/60 + kcalPerMin(2.5)*REST/60;
    if(rounds.length >= 10 && burn >= target) break; // minimum 10 min
  }
  return {rounds, burn, min: Math.round(rounds.length*perRound)};
}

function readImg(file){
  if(scansLeft()<=0){ paywall('ใช้สิทธิ์สแกนฟรีครบ 5 มื้อแล้ววันนี้'); return; }
  const r = new FileReader();
  r.onload = () => shrink(r.result, small => {
    // Demo: pick candidates from image colour profile (stand-in for the real vision model)
    guessFromImage(small, ids => startScan(ids[0], small, ids));
  });
  r.readAsDataURL(file);
}
function shrink(src, cb){
  const im = new Image();
  im.onload = () => { const s=320/Math.max(im.width,im.height); const c=document.createElement('canvas'); c.width=Math.round(im.width*Math.min(1,s)); c.height=Math.round(im.height*Math.min(1,s)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); };
  im.onerror = () => cb(src);
  im.src = src;
}
function guessFromImage(src, cb){
  const im = new Image();
  im.onload = () => {
    const c=document.createElement('canvas'); c.width=c.height=16; const x=c.getContext('2d'); x.drawImage(im,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data; let r=0,g=0,b=0; for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
    const n=d.length/4; r/=n; g/=n; b/=n;
    let pool;
    if(g>r && g>b) pool=['salad','stm','yum','kpr'];
    else if(r>150 && g>120 && b<110) pool=['ptk','mpk','croi','fch','ktm','roti'];
    else if(r>g+25) pool=['mkt','kpr','pizza','bing','shabu','sushi'];
    else if(b>r) pool=['boba','latte','thai','shabu'];
    else pool=['kmk','kpm','krs','jok','burger','chz'];
    const seed=Math.round(r+g*3+b*7);
    const rot=pool.map((_,i)=>pool[(i+seed)%pool.length]);
    cb(rot.slice(0,4));
  };
  im.onerror = () => cb(['kmk','kpr','ptk','kpm']);
  im.src = src;
}

function startScan(id, img, alts){
  if(!img && scansLeft()<=0){ paywall('ใช้สิทธิ์สแกนฟรีครบ 5 มื้อแล้ววันนี้'); return; }

  </div></div>`;
  setTimeout(()=>{ S.scansUsed++; S.sample=false; save(); renderHeader(); showResult(id, img, alts); }, 1600);
}

function showResult(id, img, alts){
  const f = byId(id);
  const conf = img ? 72 + (id.length*7)%18 : 94;
  let qty = 1;
  const draw = () => {
    $('#overlay').innerHTML = `<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div>
      <div class="photo" style="aspect-ratio:16/9">${img?`<img src="${img}" alt="รูปอาหาร">`:f.e}</div>
      <div class="row between"><div><div class="eyebrow">AI ตรวจพบ</div><h2>${f.n}</h2></div><div style="text-align:right"><div class="big num" style="font-family:var(--display);font-weight:700;font-size:26px">${fmt(f.k*qty)}</div><div class="small muted">kcal</div></div></div>
      <div><div class="row between small"><span class="muted">ความมั่นใจ</span><span class="num">${conf}%</span></div><div class="conf"><i style="width:${conf}%"></i></div></div>
      ${alts?`<div class="stack" style="gap:6px"><span class="small muted">ไม่ใช่เมนูนี้? เลือกที่ถูกต้อง</span><div class="alts">${alts.filter(a=>a!==id).map(a=>`<button class="chip" data-alt="${a}">${byId(a).e} ${byId(a).n}</button>`).join('')}</div></div>`:''}
      <div class="macro"><div><b class="num">${Math.round(f.m[0]*qty)} ก.</b><span class="small muted">โปรตีน</span></div><div><b class="num">${Math.round(f.m[1]*qty)} ก.</b><span class="small muted">คาร์บ</span></div><div><b class="num">${Math.round(f.m[2]*qty)} ก.</b><span class="small muted">ไขมัน</span></div></div>
      <div><div class="eyebrow" style="margin-bottom:4px">ส่วนผสมที่ประเมินได้</div>${f.ing.map(([n,k])=>`<div class="ing"><span>${n}</span><span class="num muted">${fmt(k*qty)} kcal</span></div>`).join('')}</div>
      <label class="field"><span class="row between small"><span class="muted">ปริมาณที่กิน</span><b class="num" id="qv">${qty}×</b></span><input type="range" id="qty" min="0.5" max="2" step="0.25" value="${qty}"></label>
      <div class="row"><button class="btn ghost" style="flex:1" onclick="closeSheet()">ยกเลิก</button><button class="btn block" style="flex:2" id="addBtn">บันทึกมื้อนี้</button></div>
      ${img?'<p class="demo-note" style="margin:0">โหมดเดโม: ผลจาก AI เป็นการจำลอง ในแอปจริงใช้โมเดล Computer Vision</p>':''}
    </div></div>`;
    $('#qty').addEventListener('input', e=>{ qty=+e.target.value; draw(); });
    document.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>showResult(b.dataset.alt, img, alts));
    $('#addBtn').onclick = () => {
      const before = totals().over;
      S.log.push({t:nowT(), id:f.id, q:qty, kind:'food', img: img||undefined});
      save(); closeSheet();
      const after = totals().over;
      if(after>before){ tab='home'; render(); toast(`เกินเป้า ${fmt(after)} kcal · มีมินิเวิร์กเอาต์รออยู่`); }
      else { tab='home'; render(); toast(`บันทึก ${f.n} แล้ว`); }
    };
  };
  draw();
}
function closeSheet(){ $('#overlay').innerHTML=''; }

function paywall(reason){
  $('#overlay').innerHTML = `<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div>
    <div class="eyebrow">OneFit Premium</div><h2>${reason}</h2>
    <p class="muted" style="margin:0">อัปเกรดเป็น Premium เพื่อสแกนอาหารไม่จำกัด และเลือกเวิร์กเอาต์ชดเชยเฉพาะจุด (หน้าท้อง / ต้นขา / แขน)</p>
    <div class="plan pro"><div class="price num">89 ฿<span class="small" style="font-weight:400;opacity:.7"> / เดือน</span></div><div class="small" style="opacity:.8">หรือชวนเพื่อน 1 คน ใช้ฟรี 1 เดือน</div></div>
    <div class="row"><button class="btn ghost" style="flex:1" onclick="closeSheet()">ไว้ก่อน</button><button class="btn lime" style="flex:2" onclick="S.premium=true;save();closeSheet();render();toast('เปิดใช้ Premium แล้ว (เดโม)')">อัปเกรด (เดโม)</button></div>
  </div></div>`;
}

/* ---------- Workout player ---------- */
let W = null;
function startWorkout(){
  const T = totals();
  const P = buildPlan(T.over || 80);
  const steps = [];
  P.rounds.forEach((e,i)=>{ steps.push({e, work:true, s:WORK}); if(i<P.rounds.length-1) steps.push({e:P.rounds[i+1], work:false, s:REST}); });
  W = {steps, i:0, left:steps[0].s, paused:false, burned:0, total:steps.reduce((a,s)=>a+s.s,0), done:0};
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  drawPlayer();
  W.timer = setInterval(tick, 1000);
}
function tick(){
  if(!W || W.paused) return;
  const st = W.steps[W.i];
  W.left--; W.done++;
  W.burned += kcalPerMin(st.work?st.e.met:2.5)/60;
  if(W.left<=0){ W.i++; if(W.i>=W.steps.length){ finishWorkout(); return; } W.left=W.steps[W.i].s; }
  drawPlayer();
}
function drawPlayer(){
  const st = W.steps[W.i];
  const next = W.steps.slice(W.i+1).find(s=>s.work);
  const mm = String(Math.floor(W.left/60)).padStart(1,'0'), ss = String(W.left%60).padStart(2,'0');
  $('#overlay').innerHTML = `<div class="player${st.work?'':' rest'}">
    <div style="width:100%;max-width:400px" class="stack">
      <div class="row between small" style="opacity:.8"><span class="num">รอบ ${W.steps.slice(0,W.i+1).filter(s=>s.work).length}/${W.steps.filter(s=>s.work).length}</span><span class="num">🔥 ${W.burned.toFixed(1)} kcal</span></div>
      <div class="bar"><i style="width:${W.done/W.total*100}%"></i></div>
    </div>
    <div class="stack" style="align-items:center">
      <div class="phase">${st.work?'ออกแรง':'พัก · ต่อไป'}</div>
      <div class="exname">${st.e.th}</div>
      <div class="small" style="opacity:.7">${st.e.n}</div>
      <div class="timer num">${mm}:${ss}</div>
      ${st.work && next?`<div class="small" style="opacity:.7">ต่อไป: ${next.e.th}</div>`:''}
    </div>
    <div class="ctl">
      <button class="btn ghost" onclick="stopWorkout()">หยุด</button>
      <button class="btn lime" onclick="W.paused=!W.paused;drawPlayer()">${W.paused?'เล่นต่อ':'พัก'}</button>
      <button class="btn ghost" onclick="skipStep()">ข้าม ›</button>
    </div>
  </div>`;
}
function skipStep(){ W.done += W.left; W.i++; if(W.i>=W.steps.length){ finishWorkout(); return; } W.left=W.steps[W.i].s; drawPlayer(); }
function stopWorkout(){
  clearInterval(W.timer);
  const burned = W.burned, mins = Math.max(1, Math.round(W.done/60));
  W=null;
  if(burned>=5){ S.log.push({t:nowT(), kind:'workout', burn:Math.round(burned), min:mins}); save(); toast(`บันทึกการเผาผลาญ ${Math.round(burned)} kcal`); }
  closeSheet(); tab='home'; render();
}
const PARTNERS = [['Green Bowl Café','ลด 20% เมนูสลัดและโบวล์คลีน'],['FitMeal Delivery','ส่วนลด 40 ฿ อาหารคลีนกล่องแรก'],['Juice Lab','ซื้อ 1 แถม 1 น้ำผักผลไม้สกัดเย็น']];
function finishWorkout(){
  clearInterval(W.timer);
  const burned = Math.round(W.burned), mins = Math.round(W.total/60);
  S.log.push({t:nowT(), kind:'workout', burn:burned, min:mins});
  const [shop,deal] = PARTNERS[S.coupons.length % PARTNERS.length];
  const code = 'FIT' + Math.random().toString(36).slice(2,7).toUpperCase();
  S.coupons.unshift({shop, deal, code});
  save(); W=null;
  $('#overlay').innerHTML = `<div class="player">
    <div></div>
    <div class="stack" style="align-items:center;gap:14px;width:100%;max-width:400px">
      <div class="phase">ชดเชยสำเร็จ</div>
      <div class="timer num" style="font-size:72px">−${burned}</div>
      <div>kcal ใน ${mins} นาที</div>
      <div class="coupon"><div class="small" style="font-weight:600">รางวัลจากร้านพาร์ทเนอร์</div><div style="font-family:var(--display);font-size:18px;font-weight:600">${shop}</div><div class="small">${deal}</div><div class="code num" style="margin-top:6px">${code}</div></div>
    </div>
    <div class="ctl"><button class="btn lime" onclick="closeSheet();go('home')">กลับหน้าหลัก</button></div>
  </div>`;
}

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
render();
</script>
</body>
